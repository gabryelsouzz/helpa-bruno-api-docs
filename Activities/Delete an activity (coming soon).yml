info:
  name: Delete an activity (coming soon)
  type: http
  seq: 7
  tags:
    - Activities

http:
  method: DELETE
  url: "{{baseUrl}}/activities/:id"
  headers:
    - name: token
      value: "{{apiKey}}"
  params:
    - name: id
      value: ""
      type: path
      description: Activity UUID
  auth:
    type: apikey
    key: token
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Activity soft-deleted successfully. No content returned.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: DELETE
      headers:
        - name: token
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthenticated.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: DELETE
      headers:
        - name: token
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: Forbidden.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: DELETE
      headers:
        - name: token
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
