  - name: 404 Response
    description: Activity not found or already deleted.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: DELETE
      headers:
        - name: token
          value: "{{apiKey}}"
      params:
        - name: id
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
