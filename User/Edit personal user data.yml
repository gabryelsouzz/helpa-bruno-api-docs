info:
  name: Edit personal user data
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  body:
    type: json
    data: |-
      {
        "fullName": "Maria Silva Souza",
        "currentPassword": "senhaAtual123",
        "newPassword": "novaSenha456"
      }
  auth:
    type: bearer
    token: "{{apiKey}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # PATCH /users/me — Edição do perfil

  Atualiza os dados editáveis do usuário autenticado.
  campos de vínculo institucional e de permissão são imutáveis por aqui.

  ## Autenticação
  - Bearer token (JWT) obrigatório.
  - O `userId` é extraído exclusivamente do token.

  ## Body (todos os campos opcionais; whitelist explícita)
  | Campo             | Tipo   | Regra |
  |-------------------|--------|-------|
  | `fullName`        | string | 1–255 caracteres |
  | `newPassword`     | string | mín. 8 caracteres, com letras e números; diferente da senha atual |
  | `currentPassword` | string | **obrigatório** quando `newPassword` estiver presente |

  Qualquer campo fora da whitelist (`registrationCode`, `course`, `userType`,
  `email`, `id`, ...) leva a um erro **400** com **NENHUMA persistência**.

  ## Resposta — 200 OK
  ```json
  {
    "id": "uuid",
    "fullName": "Maria Silva Souza",
    "email": "maria@aluno.ufal.br",
    "course": "Ciência da Computação",
    "registrationCode": "2021001234",
    "userType": "STUDENT",
    "createdAt": "2026-01-15T10:30:00.000Z"
  }
  ```

  ## Regras de negócio
  - `registrationCode`, `course` e `userType` são imutáveis via API.
  - Nova senha persistida apenas como hash bcrypt.
  - `updatedAt` é atualizado automaticamente.

  ## Erros
  | Status | Quando |
  |--------|--------|
  | 400    | Campo fora da whitelist; senha fraca; `newPassword` igual à atual; `newPassword` sem `currentPassword` |
  | 401    | Token ausente/inválido/expirado; `currentPassword` incorreta |
  | 404    | Usuário do token não existe mais |

  Corpo de erro padronizado:
  ```json
  { "statusCode": 400, "error": "IMMUTABLE_FIELD", "message": "O campo 'registrationCode' não pode ser alterado." }
  ```
