info:
  name: Get personal user data
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{apiKey}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /users/me — Dados do perfil

  Retorna os dados cadastrais do usuário autenticado.
  Alimenta a subseção **Dados Pessoais** da tela de Perfil.

  ## Autenticação
  - Bearer token (JWT) obrigatório
  - O `userId` é extraído exclusivamente do token.

  ## Resposta — 200 OK
  ```json
  {
    "id": "uuid",
    "fullName": "Maria Silva",
    "email": "maria@aluno.ufal.br",
    "course": "Ciência da Computação",
    "registrationCode": "2021001234",
    "userType": "STUDENT",
    "createdAt": "2026-01-15T10:30:00.000Z"
  }
  ```

  ## Mapeamento de campos DTO -> Prisma
  | Campo              | Origem |
  |--------------------|--------|
  | `fullName`         | `User.fullName` |
  | `email`            | `User.email` |
  | `userType`         | `User.userType` (enum `STUDENT` \| `TEACHER`, sem tradução) |
  | `registrationCode` | `Student.registrationCode` ou `Teacher.registrationCode` (conforme `userType`) |
  | `course`           | `Student.course` ou `Teacher.course` (**pode ser `null`nesse último caso** |

  ## Regras de negócio
  - Somente o dono do token visualiza o próprio perfil;
  - `passwordHash` e demais campos internos nunca são serializados.
  - `registrationCode`, `course` e `userType` são somente leitura.

  ## Erros
  | Status | Quando |
  |--------|--------|
  | 401    | Token ausente, inválido ou expirado |
  | 404    | Usuário do token não existe mais |

  Corpo de erro padronizado:
  ```json
  { "statusCode": 401, "error": "UNAUTHORIZED", "message": "Token ausente, inválido ou expirado." }
  ```
