info:
  name: List user activities
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/me/activities?filter=enrolled&page=1&limit=20"
  params:
    - name: filter
      value: enrolled
      type: query
      description: enrolled | completed | managed
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: limit
      value: "20"
      type: query
      description: Itens por página (máx. 50)
  auth:
    type: bearer
    token: "{{apiKey}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /users/me/activities — Ações inscritas, concluídas e gerenciadas

  Lista as ações vinculadas ao usuário autenticado segundo o filtro escolhido.

  ## Autenticação
  - Bearer token (JWT) obrigatório.
  - O `userId` é extraído exclusivamente do token.

  ## Query params
  | Param  | Tipo | Obrigatório   | Descrição |
  |--------|------|---------------|-----------|
  | filter | enum | sim           | `enrolled` \| `completed` \| `managed` |
  | page   | int  | não (def. 1)  | Página atual |
  | limit  | int  | não (def. 20) | Itens por página (máx. 50) |


  ## Matriz de filtros
  | filter      | Regra (todas com `Activity.deletedAt IS NULL`) |
  |-------------|------------------------------------------------|
  | `enrolled`  | `Enrollment.status = APPROVED` do usuário E `Activity.status` em (`OPEN`, `IN_PROGRESS`) |
  | `completed` | `Enrollment.status = APPROVED` E `Enrollment.attendanceConfirmed = true` |
  | `managed`   | `Activity.authorId = userId` |

  ## Resposta — 200 OK
  ```json
  {
    "data": [
      {
        "id": "uuid",
        "title": "Mutirão de Limpeza da Lagoa",
        "description": "Ação voluntária de coleta de resíduos...",
        "location": "Lagoa do Roteiro, Maceió",
        "startDate": "2026-08-20T14:00:00.000Z",
        "status": "OPEN",
        "category": "EXTENSION",
        "workloadHours": 8
      }
    ],
    "total": 1,
    "page": 1,
    "limit": 20
  }
  ```

  ## Mapeamento de campos (DTO -> Prisma)
  | Campo           | Origem |
  |-----------------|--------|
  | `startDate`     | `Activity.startDate` |
  | `status`        | `Activity.status` (enum `OPEN` \| `IN_PROGRESS` \| `COMPLETED` \| `CANCELLED`) |
  | `category`      | `Activity.type` (enum `EXTENSION` \| `COURSE` \| `EVENT` \| `LECTURE` \| `OTHER`) |
  | `workloadHours` | `ActivityDetails.workloadHours` — `null` quando a ação não tem detalhes |
  | `location`      | `ActivityDetails → Address` (resumo em string) |

  ## Regras de negócio
  - O usuário só visualiza o próprio histórico.
  - Inscrições `PENDING` ou `REJECTED` não aparecem em nenhum filtro.
  - Ações com soft delete (`deletedAt != null`) não aparecem em nenhum filtro.
  - Ordenação padrão: `startDate` decrescente.

  ## Erros
  | Status | Quando |
  |--------|--------|
  | 400    | `filter` ausente ou com valor inválido; `page`/`limit` inválidos |
  | 401    | Token ausente, inválido ou expirado |

  Corpo de erro padronizado:
  ```json
  { "statusCode": 400, "error": "VALIDATION_ERROR", "message": "Parâmetro 'filter' deve ser enrolled, completed ou managed." }
  ```
