info:
  name: List user's certificates (coming soon)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/me/certificates"
  params:
    - name: page
      value: "1"
      type: query
      description: Current page
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Items per page (max. 50)
      disabled: true
  auth:
    type: bearer
    token: "{{apiKey}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Paginated list with totalHours
    description: Student with one issued certificate.
    response:
      status: 200
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "a1b2c3d4-0000-4000-8000-000000000020",
                "activityTitle": "Computer Science Week — Git Workshop",
                "workloadHours": 8,
                "activityDate": "2026-06-10T14:00:00.000Z",
                "issuedAt": "2026-06-15T09:00:00.000Z",
                "validationCode": "HELPA-2026-A1B2C3"
              }
            ],
            "meta": {
              "total": 1,
              "page": 1,
              "limit": 20,
              "totalPages": 1,
              "totalHours": 8
            }
          }
  - name: 200 User without certificates
    description: Never returns 404 for an empty list.
    response:
      status: 200
      body:
        type: json
        data: |-
          {
            "data": [],
            "meta": { "total": 0, "page": 1, "limit": 20, "totalPages": 0, "totalHours": 0 }
          }
  - name: 401 Missing or invalid token
    response:
      status: 401
      body:
        type: json
        data: |-
          {
            "status": 401,
            "message": "Missing, invalid or expired token."
          }
